<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">

<title>Portal SFFContables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&display=swap">
<style>
.wm{font-family:'Cormorant SC',Georgia,serif;font-size:23px;font-weight:700;letter-spacing:.3px;line-height:1.05}
/* Layout: acceso centrado → app con barra superior (escritorio) y barra inferior (móvil), vistas por ruta */
:root{
  --petrol:#143A3A; --petrol-deep:#0E2A2B; --petrol-soft:#1C4646; --line:#2F5B58;
  --cream:#FBF8F2; --sand:#F3ECE0; --border:#E8DFD1; --mint:#E7EFEC;
  --ink:#143A3A; --muted:#4F6664; --body:#3E5553; --sage:#A9BDB9; --sage-light:#D6E2DE;
  --terra:#B4512C; --terra-soft:#E8A27C; --peach:#FBEBD9; --rust:#8A3B1E; --white:#ffffff;
  --font:Arial, Helvetica, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
a{color:var(--ink)}
button{font-family:var(--font)}
a:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--terra-soft);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.blob{position:fixed;pointer-events:none;z-index:0}
.pill{border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent;min-height:44px}
.btn-terra{background:var(--terra);color:var(--white)}
.btn-terra:hover{background:#9C4524;color:var(--white)}
.btn-dark{background:var(--petrol);color:var(--cream)}
.btn-line{background:var(--white);border-color:var(--ink);color:var(--ink)}
.btn-ghost{background:transparent;border-color:var(--sage);color:var(--cream)}
.card{background:var(--white);border:1px solid var(--border);border-radius:30px;padding:28px}
.card-dark{background:var(--petrol);color:var(--cream);border-radius:30px;padding:28px}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--terra);font-weight:700;text-transform:uppercase}
.tag{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--mint);color:var(--petrol-soft)}
.t-warn{background:var(--terra);color:var(--white)}
.t-wait{background:var(--sand);color:#5A4A2E}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:22px}
.row{display:flex;flex-wrap:wrap;gap:22px;align-items:stretch}
h1,h2,h3{text-wrap:balance}
h1{margin:0;font-size:clamp(32px,4.4vw,54px);line-height:1.08;letter-spacing:-.5px}
h2{margin:4px 0 0;font-size:24px;line-height:1.25}
.num{font-variant-numeric:tabular-nums}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,248,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:42px;height:42px;border-radius:14px;background:var(--petrol);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.nav{display:flex;gap:4px;background:var(--white);border:1px solid var(--border);border-radius:999px;padding:5px}
.nav a{padding:9px 16px;border-radius:999px;text-decoration:none;font-size:14px}
.nav a[aria-current="page"]{background:var(--petrol);color:var(--cream);font-weight:700}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:999px;background:var(--terra);color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--terra-soft);color:var(--petrol);display:flex;align-items:center;justify-content:center;font-weight:700;border:0;cursor:pointer}
.panel{position:absolute;right:20px;top:66px;width:340px;max-width:calc(100vw - 32px);background:var(--white);border:1px solid var(--border);border-radius:24px;box-shadow:0 24px 50px -20px rgba(14,42,43,.45);padding:16px;z-index:30}
.bottom-nav{display:none}
main{position:relative;z-index:1;padding-block:28px 110px}
@media (max-width:860px){
  .nav{display:none}
  .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--white);border:1px solid var(--border);border-radius:999px;padding:6px;justify-content:space-between;box-shadow:0 10px 30px -12px rgba(14,42,43,.35)}
  .bottom-nav a{flex:1;text-align:center;padding:10px 0;border-radius:999px;text-decoration:none;font-size:12px}
  .bottom-nav a[aria-current="page"]{background:var(--petrol);color:var(--cream);font-weight:700}
  .hide-sm{display:none}
}
/* listas */
.item{display:flex;align-items:center;gap:14px;border-radius:20px;padding:14px 16px;background:var(--cream)}
.item.hot{background:var(--peach)}
.date{width:54px;flex-shrink:0;text-align:center;line-height:1.1}
.date b{display:block;font-size:22px}
.date span{font-size:12px;color:var(--muted)}
.hot .date b,.hot .date span{color:var(--rust)}
.grow{flex:1 1 auto;min-width:0}
.sub{font-size:13px;color:var(--body)}
.check{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:18px;padding:12px 16px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--petrol);flex-shrink:0}
.check.done span{text-decoration:line-through;color:var(--muted)}
.folder{background:var(--cream);border-radius:24px;padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--petrol);color:var(--cream);border-radius:999px;padding:12px 20px;font-size:14px;z-index:40;max-width:calc(100vw - 32px);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border-radius:999px;padding:11px 18px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--petrol);color:var(--cream);border-color:var(--petrol);font-weight:700}
.msg{max-width:85%;border-radius:20px;padding:12px 16px;font-size:15px}
.msg.them{background:var(--white);border:1px solid var(--border);align-self:flex-start}
.msg.me{background:var(--petrol);color:var(--cream);align-self:flex-end}
.msg small{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
/* acceso */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;z-index:1}
.login-card{width:100%;max-width:440px;background:var(--white);border:1px solid var(--border);border-radius:36px;padding:36px 32px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 60px -30px rgba(14,42,43,.4)}
.note{font-size:13px;color:var(--muted)}
.err{background:var(--peach);color:var(--rust);border-radius:16px;padding:12px 14px;font-size:14px}
/* móvil */
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden}
@media (max-width:860px){
  .bottom-nav{padding:5px;gap:2px}
  .bottom-nav a{padding:11px 0;min-height:44px;display:flex;align-items:center;justify-content:center}
  .panel{position:fixed;left:12px;right:12px;width:auto;top:calc(72px + env(safe-area-inset-top,0px));max-height:calc(100vh - 180px);overflow-y:auto}
}
@media (max-width:600px){
  .wrap{padding-inline:14px}
  .top .wrap{padding-block:10px}
  main{padding-block:20px 120px}
  .card,.card-dark{padding:20px 18px;border-radius:24px}
  .grid3,.row{gap:16px}
  h1{font-size:clamp(28px,8.4vw,36px)}
  h2{font-size:21px}
  .item{padding:12px;gap:10px;border-radius:18px}
  .date{width:44px}
  .date b{font-size:19px}
  .acts{padding-left:0!important}
  .acts .btn{flex:1 1 100%}
  .btn{padding:12px 16px}
  .login{align-items:flex-start;padding:20px 14px calc(24px + env(safe-area-inset-bottom,0px))}
  .login-card{padding:26px 20px;border-radius:28px;gap:14px}
  .msg{max-width:92%}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-14px;padding:2px 14px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;white-space:nowrap}
  .blob{opacity:.6}
  footer.wrap{padding-bottom:120px!important}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .35s ease}@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

function hojaId(t){t=String(t||'').trim();var m=/\/d\/([a-zA-Z0-9_-]{20,})/.exec(t);if(m)return m[1];m=/[?&]c=([a-zA-Z0-9_-]{20,})/.exec(t);if(m)return m[1];return /^[a-zA-Z0-9_-]{20,}$/.test(t)?t:'';}
function gviz(id,hoja,rango){
  var url='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id)+'/gviz/tq?tqx=out:json&headers=0&sheet='+encodeURIComponent(hoja)+'&range='+encodeURIComponent(rango);
  return fetch(url).then(function(r){if(!r.ok)throw new Error('acceso');return r.text();}).then(function(t){
    var a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('acceso');
    var j=JSON.parse(t.slice(a,b+1));if(j.status==='error')throw new Error('acceso');
    return (j.table.rows||[]).map(function(r){return (r.c||[]).map(celda);}).filter(function(r){return r.some(function(x){return x!=='';});});

function celda(c){if(!c||c.v==null)return '';var v=c.v;

function cargarHoja(id){

 return '<div class="login"><div class="login-card"><div style="display:flex;align-items:center;gap:12px"><span class="logo-mark">'+MARK+'</span><div style="line-height:1.25"><b class="wm">SFFContables</b><div class="sub">Contadores públicos · Panamá</div></div></div>'+
  '<h1 style="font-size:clamp(26px,7vw,30px)">Bienvenido a su portal</h1><p style="margin:0;color:var(--body)">Sus números, sus impuestos y sus documentos, en un solo lugar y con su asesora a un mensaje de distancia.</p>'+
  (S.err?'<div class="err" role="alert">'+esc(S.err)+'</div>':'')+
  (S.cargando?'<div class="err" role="status" style="background:var(--mint);color:var(--petrol-soft)">Abriendo su portal…</div>':
  '<div style="background:var(--cream);border-radius:20px;padding:14px 16px;font-size:15px;color:var(--body)"><b style="color:var(--ink)">No necesita cuenta ni contraseña.</b> Entre con el enlace privado que le enviamos por WhatsApp o correo. Si lo tiene a mano, péguelo aquí:</div>'+
  '<form id="linkForm" style="display:flex;flex-direction:column;gap:10px"><label for="linkTxt" style="position:absolute;left:-9999px">Enlace de su portal</label><input id="linkTxt" required autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url" placeholder="Pegue aquí su enlace" style="width:100%;border:1px solid var(--border);border-radius:999px;padding:13px 18px;font:inherit;font-size:16px;background:var(--white)"><button class="btn btn-dark" type="submit" style="width:100%">Entrar a mi portal</button></form>'+
  '<a class="btn btn-terra" style="width:100%" target="_blank" rel="noopener" href="'+wa('Hola SFFContables, quisiera recibir el enlace de mi portal de clientes.')+'">Pedir mi enlace por WhatsApp</a>'+
  '<button class="btn btn-line" id="demo" style="width:100%">Explorar en modo demostración</button>')+
  '<p class="note" style="margin:0">Su enlace es personal: no lo comparta. Sus datos se tratan conforme a la Ley 81 de 2019 de protección de datos personales. <a href="'+esc(CONFIG.sitio)+'">Volver al sitio</a></p></div></div>';}

function render(){var root=$('#root');
 if(!S.user){root.innerHTML=vLogin();return;}
 var r=route(),v={inicio:vInicio,calendario:vCalendario,documentos:vDocumentos,aprende:vAprende,asesora:vAsesora}[r]();
 root.innerHTML=header(r)+'<main class="wrap"><div class="view">'+v+'</div></main><footer class="wrap" style="position:relative;z-index:1;padding-bottom:110px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:20px"><span>SFFContables · Contadores públicos · Panamá</span><span>Su negocio importa. Crecemos juntos. · Ley 81 de 2019 y debida diligencia</span></footer>'+bottomNav(r);
}

/* ====== EVENTOS ====== */
document.addEventListener('click',function(e){var t=e.target;
 if(t.closest('#demo')){S.user={id:'demo',demo:true};S.data=DEMO;S.err='';go('inicio');return;}
 if(t.closest('#me')){S.user=null;S.data=null;S.panel=false;S.err='';store('hoja',null);try{history.replaceState(null,'',location.pathname);}catch(_){}render();return;}
 if(t.closest('#bell')){S.panel=!S.panel;render();return;}
 if(S.panel&&!t.closest('.panel')){S.panel=false;render();}
 var ap=t.closest('[data-aprobar]');if(ap){S.local[ap.getAttribute('data-aprobar')]='aprobado';saveLocal();window.open(wa('Hola SFFContables, apruebo el borrador de '+ap.getAttribute('data-nombre')+' ('+S.data.empresa+').'),'_blank','noopener');render();toast('Se abrió WhatsApp con su aprobación. Envíe el mensaje para confirmarla.');return;}
 var c=t.closest('[data-cat]');if(c){S.cat=c.getAttribute('data-cat');S.open=-1;render();return;}
 var k=t.closest('[data-cap]');if(k){var i=+k.getAttribute('data-cap');S.open=S.open===i?-1:i;render();return;}
 var tp=t.closest('[data-tip]');if(tp){S.tip=(S.tip+(+tp.getAttribute('data-tip'))+TIPS.length)%TIPS.length;render();return;}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.hasAttribute('data-doc')){S.local['d:'+t.getAttribute('data-doc')]=t.checked;saveLocal();render();toast(t.checked?'Marcado como subido.':'Marcado como pendiente.');}
 if(t.hasAttribute('data-hab')){S.hab[+t.getAttribute('data-hab')]=t.checked;render();}
});
document.addEventListener('submit',function(e){if(e.target.id==='linkForm'){e.preventDefault();var id=hojaId($('#linkTxt').value);if(!id){S.err='Ese enlace no parece válido. Copie el enlace completo que le enviamos.';render();return;}entrar(id);return;}
 if(e.target.id==='msgForm'){e.preventDefault();var v=$('#msgTxt').value.trim();if(!v)return;
 S.local.enviados=(S.local.enviados||[]).concat([v]);saveLocal();window.open(wa(v),'_blank','noopener');render();toast('Se abrió WhatsApp con su mensaje.');}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.panel){S.panel=false;render();}});
window.addEventListener('popstate',render);window.addEventListener('hashchange',render);
var _c=hojaId(new URLSearchParams(location.search).get('c'))||store('hoja');if(_c)entrar(_c);else render();
</script>

</html>
