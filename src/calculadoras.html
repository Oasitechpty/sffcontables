    h+=field('zfNet','Utilidad neta anual ('+C.cur+')',C.pjDefault.net);
    h+=field('zfExp',Z.mx?'% de ingresos obtenidos en la región':'% de la utilidad proveniente de actividades exentas (exportación, reexportación, servicios al exterior)',Z.mx?100:85);
    if(Z.cr){h+=`<div class="row2">${select('crLoc','Ubicación',[['gam','Dentro de la GAM'],['fuera','Fuera de la GAM']],'gam')}${field('crYear','Año de operación',3,{step:1})}</div>`;}
    else h+=field('zfEx','% de exención aplicable',Z.ex,{hint:'Valor sugerido según el régimen. Ajústelo a su resolución.'});
    if(Z.divGen!=null)h+=field('zfDiv','% de la utilidad que distribuirá como dividendos',100);
    h+=`<p class="ref">${Z.ref}</p>`;
  }else{
    const P=C.payroll;
    h+=`<h2>Nómina y horas extra · ${C.name}</h2>`;
    h+=`<div class="row2">${field('nSal','Salario mensual ('+C.cur+')',P.salary)}${select('nJor','Jornada',Object.keys(P.hSem).map(k=>[k,({diurna:'Diurna',nocturna:'Nocturna',mixta:'Mixta',cuarenta:'Jornada de 40 horas'})[k]+' ('+P.hSem[k]+' h/sem)']),'diurna')}</div>`;
    h+=`<div class="sec" style="color:var(--terra)">Horas trabajadas en el mes</div>`;
    h+=`<div class="row2">${P.extras.map(([id,l,m,r],i)=>field('x_'+id,l,i===0?10:0,{hint:r})).join('')}</div>`;
    h+=`<p class="ref">${P.maxRef}</p>`;
  }
  f.innerHTML=h;
  const ap=$('#pnApply');
  if(ap)ap.addEventListener('click',()=>{const m=num('pnMes');if(m>0){$('#pnIng').value=(m*COUNTRIES[state.c].pnHelper.mult).toFixed(2);calc();}else{$('#pnMes').focus();}});
}

function rowsTable(head,rows,tot){return `<div class="tbl-wrap"><table><thead><tr>${head.map((x,i)=>`<th${i?' class="n"':''}>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="n"':''}>${x}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="tot">${tot.map((x,i)=>`<td${i?' class="n"':''}>${x}</td>`).join('')}</tr>`:''}</tbody></table></div>`;}
function kpis(list){return `<div class="kpis">${list.map(([l,v])=>`<div class="kpi"><span>${l}</span><strong>${v}</strong></div>`).join('')}</div>`;}
function wa(text){return 'https://wa.me/50767387942?text='+encodeURIComponent(text);}

function calc(){
  const C=COUNTRIES[state.c];let out='',summary='',warn='';
  if(state.t==='pn'){
    let base,tax,rows=[],label='Impuesto anual estimado';
    if(state.c==='CR'){
      const tipo=$('#crTipo').value,ing=num('pnIng');
      const r=progressive(ing,tipo==='sal'?CR_SAL:CR_LUC);
      let cred=num('crHij')*CR_CRED.hijo+(+$('#crCon').value)*CR_CRED.conyuge; if(tipo==='luc')cred*=12;
      base=ing;tax=Math.max(0,r.tax-cred);rows=r.rows.map(x=>[fmt(x.from)+' – '+fmt(x.to),pct(x.r),fmt(x.t)]);
      if(cred>0)rows.push(['Créditos familiares','',' −'+fmt(Math.min(cred,r.tax))]);
      label=tipo==='sal'?'Impuesto al salario mensual':'Impuesto anual estimado';
      out+=`<div class="lbl">${label}</div><div class="big">${fmt(tax)}</div><p class="sub">Tasa efectiva ${pct(ing?tax/ing:0)}</p>`;
      out+=kpis([['Ingreso',fmt(ing)],['Neto después de impuesto',fmt(ing-tax)]]);
      out+=rowsTable(['Tramo','Tasa','Impuesto'],rows,['Total','',fmt(tax)]);
      summary=`ISR persona natural ${C.name}: ingreso ${fmt(ing)}, impuesto estimado ${fmt(tax)}.`;
    }else{
      const ing=num('pnIng'),ded=num('pnDed');
      if(state.c==='MX'){base=Math.max(0,ing-ded);const m=mxMonthly(base/12);tax=m.tax*12;rows=m.row?[[fmt(m.row[0]*12)+' en adelante',pct(m.row[2]),fmt(tax)]]:[];
        out+=`<div class="lbl">ISR anual estimado</div><div class="big">${fmt(tax)}</div><p class="sub">Tasa efectiva ${pct(ing?tax/ing:0)}</p>`;
        out+=kpis([['Base gravable',fmt(base)],['Cuota fija anual',fmt(m.row?m.row[1]*12:0)],['Ingreso neto',fmt(ing-tax)]]);
        out+=rowsTable(['Tramo aplicable','% excedente','ISR'],rows);
      }else{
        let fixed=0,fixedLbl='';
        if(state.c==='GT'){fixed=48000;fixedLbl='Deducción fija';}
        if(state.c==='PE'){fixed=38500;fixedLbl='Deducción de 7 UIT';}
        const dedUsed=state.c==='PE'?Math.min(ded,16500):ded;
        base=Math.max(0,ing-fixed-dedUsed);const r=progressive(base,C.pnBr);tax=r.tax;
        rows=r.rows.map(x=>[fmt(x.from)+' – '+fmt(x.to),pct(x.r),fmt(x.t)]);
        out+=`<div class="lbl">Impuesto anual estimado</div><div class="big">${fmt(tax)}</div><p class="sub">Tasa efectiva ${pct(ing?tax/ing:0)} · Retención mensual aprox. ${fmt(tax/(C.pnHelper?C.pnHelper.mult:12))}</p>`;
        const k=[['Ingreso anual',fmt(ing)]];if(fixed)k.push([fixedLbl,fmt(fixed)]);k.push(['Renta gravable',fmt(base)]);
        out+=kpis(k);
        out+=rowsTable(['Tramo','Tasa','Impuesto'],rows,['Total','',fmt(tax)]);
        if(state.c==='PE'&&ded>16500)warn='Las deducciones adicionales se limitaron al tope de 3 UIT (S/ 16,500).';
      }
      summary=`ISR persona natural ${C.name}: ingreso anual ${fmt(ing)}, impuesto estimado ${fmt(tax)}.`;
    }
  }else if(state.t==='pj'){
    const g=num('pjGross'),n=num('pjNet');let rows=[],tax=0,lead='',extra=[];
    if(state.c==='PA'){
      const trad=n*.25;let cair=0;
      rows.push(['Método tradicional (25% de la renta neta)',fmt(trad)]);
      if(g>1500000){cair=g*.0467*.25;rows.push(['CAIR (25% sobre 4.67% de ingresos gravables)',fmt(cair)]);}
      tax=Math.max(trad,cair);lead=g>1500000?(cair>trad?'Aplica el CAIR por ser mayor':'Aplica el método tradicional'):'No aplica CAIR (ingresos hasta B/.1,500,000)';
      if(g>1500000&&cair>trad)warn='El CAIR supera al método tradicional. Si la tasa efectiva excede 25%, puede solicitarse a la DGI la no aplicación del CAIR.';
    }else if(state.c==='CR'){
      if(g<=CR_PJ_LIMIT){const r=progressive(n,CR_PJ);tax=r.tax;rows=r.rows.map(x=>[fmt(x.from)+' – '+fmt(x.to)+' · '+pct(x.r),fmt(x.t)]);lead='Tarifa progresiva para pequeñas empresas';}
      else{tax=n*.30;rows=[['Tarifa general 30%',fmt(tax)]];lead='Tarifa general (ingresos brutos sobre ₡119,174,000)';}
    }else if(state.c==='GT'){
      const util=n*.25;const m=g/12;const opc=12*(Math.min(m,30000)*.05+Math.max(0,m-30000)*.07);
      rows=[['Régimen sobre utilidades (25%)',fmt(util)],['Régimen opcional simplificado sobre ingresos',fmt(opc)]];
      tax=Math.min(util,opc);lead=util<=opc?'Menor carga: régimen sobre utilidades':'Menor carga: régimen opcional simplificado';
    }else if(state.c==='MX'){tax=n*.30;rows=[['Tasa de 30% sobre resultado fiscal',fmt(tax)]];lead='Régimen general de personas morales';}
    else{
      const reg=$('#peReg').value;
      if(reg==='mype'&&g<=9350000){const a=Math.min(n,82500)*.10,b=Math.max(0,n-82500)*.295;tax=a+b;rows=[['Hasta 15 UIT al 10%',fmt(a)],['Exceso al 29.5%',fmt(b)]];lead='Régimen MYPE Tributario';}
      else{tax=n*.295;rows=[['Tasa de 29.5%',fmt(tax)]];lead='Régimen General';if(reg==='mype')warn='Los ingresos superan 1,700 UIT (S/ 9,350,000): corresponde el Régimen General.';}
    }
    out+=`<div class="lbl">ISR anual estimado</div><div class="big">${fmt(tax)}</div><p class="sub">${lead} · Tasa efectiva ${pct(n?tax/n:0)} sobre renta neta</p>`;
    out+=kpis([['Ingresos brutos',fmt(g)],['Renta neta',fmt(n)],['Utilidad después de ISR',fmt(n-tax)]]);
    out+=rowsTable(['Concepto','Monto'],rows);
    summary=`ISR persona jurídica ${C.name}: ingresos ${fmt(g)}, renta neta ${fmt(n)}, impuesto estimado ${fmt(tax)}.`;
  }else if(state.t==='zf'){
    const Z=C.zf,n=num('zfNet'),sh=Math.min(100,num('zfExp'))/100;let ex;
    if(Z.cr){const y=Math.max(1,num('crYear')),gam=$('#crLoc').value==='gam';ex=gam?(y<=8?1:y<=12?.5:0):(y<=12?1:y<=18?.5:0);}
    else ex=Math.min(100,num('zfEx'))/100;
    const gen=n*Z.rate;
    let zf=Z.mx? gen - n*sh*Z.rate*ex : n*(1-sh)*Z.rate + n*sh*Z.rate*(1-ex);
    zf=Math.max(0,zf);
    const rows=[['ISR régimen general ('+pct(Z.rate)+')',fmt(gen)],['ISR con '+Z.label.toLowerCase(),fmt(zf)]];
    let divTotGen=0,divTotZf=0;
    if(Z.divGen!=null){const d=Math.min(100,num('zfDiv'))/100;divTotGen=(n-gen)*d*Z.divGen;divTotZf=(n-zf)*d*Z.divZf;rows.push(['Impuesto de dividendos, régimen general ('+pct(Z.divGen)+')',fmt(divTotGen)]);rows.push(['Impuesto de dividendos, zona franca ('+pct(Z.divZf)+')',fmt(divTotZf)]);}
    const ahorro=(gen+divTotGen)-(zf+divTotZf);
    out+=`<div class="lbl">Ahorro fiscal anual estimado</div><div class="big">${fmt(ahorro)}</div><p class="sub">Exención aplicada ${pct(ex)} sobre ${pct(sh)} de la utilidad</p>`;
    out+=kpis([['Carga régimen general',fmt(gen+divTotGen)],['Carga en el régimen especial',fmt(zf+divTotZf)],['Tasa efectiva especial',pct(n?(zf+divTotZf)/n:0)]]);
    out+=rowsTable(['Concepto','Monto'],rows);
    if(Z.cr&&ex===0)warn='Según el año indicado, el período de exención ya terminó.';
    summary=`Zona franca ${C.name}: utilidad ${fmt(n)}, ahorro estimado ${fmt(ahorro)}.`;
  }else{
    const P=C.payroll,sal=num('nSal'),jor=$('#nJor').value,h=P.hSem[jor];
    const vh=sal*12/52/h;let hx=0,totH=0;const xr=[];
    P.extras.forEach(([id,l,m])=>{const q=num('x_'+id);if(q>0){const v=q*vh*m;hx+=v;totH+=q;xr.push([l+' · '+q+' h × '+m.toFixed(2),fmt(v)]);}});
    const bonif=P.bonif||0;const gross=sal+hx;
    const empRows=P.emp.map(([l,r])=>[l+' ('+pct(r)+')',gross*r]);
    const ssEmp=empRows.reduce((a,b)=>a+b[1],0);
    let isr=0;
    if(state.c==='PA'){isr=progressive(gross*13,C.pnBr).tax/13;}
    else if(state.c==='CR'){isr=progressive(gross,CR_SAL).tax;}
    else if(state.c==='GT'){isr=progressive(Math.max(0,gross*12-48000-ssEmp*12),C.pnBr).tax/12;}
    else if(state.c==='MX'){const m=mxMonthly(gross).tax;isr=gross<=MX_SUB.limit?Math.max(0,m-MX_SUB.amount):m;}
    else{isr=progressive(Math.max(0,gross*14-38500),C.pnBr).tax/12;}
    const neto=gross+bonif-ssEmp-isr;
    const patRows=P.pat.map(([l,r])=>[l+' ('+pct(r)+')',gross*r]);
    const provRows=P.prov.map(([l,r])=>[l,sal*r]);
    const pat=patRows.reduce((a,b)=>a+b[1],0),prov=provRows.reduce((a,b)=>a+b[1],0);
    const costo=gross+bonif+pat+prov;
    out+=`<div class="lbl">Salario neto del mes</div><div class="big">${fmt(neto)}</div><p class="sub">Valor hora ${fmt(vh)} · Costo total para el empleador ${fmt(costo)}</p>`;
    out+=kpis([['Pago por horas extra',fmt(hx)],['Salario bruto',fmt(gross+bonif)],['Costo empleador',fmt(costo)]]);
    let rows=[['Salario base',fmt(sal)]].concat(xr);if(bonif)rows.push(['Bonificación incentivo',fmt(bonif)]);
    out+=`<div class="sec">Ingresos</div>`+rowsTable(['Concepto','Monto'],rows,['Total devengado',fmt(gross+bonif)]);
    out+=`<div class="sec">Deducciones del trabajador</div>`+rowsTable(['Concepto','Monto'],empRows.map(r=>[r[0],fmt(r[1])]).concat([['Retención de impuesto sobre la renta',fmt(isr)]]),['Neto a pagar',fmt(neto)]);
    out+=`<div class="sec">Aportes y provisiones del empleador</div>`+rowsTable(['Concepto','Monto'],patRows.map(r=>[r[0],fmt(r[1])]).concat(provRows.map(r=>[r[0],fmt(r[1])])),['Costo total mensual',fmt(costo)]);
    if(jor==='cuarenta')warn='Jornada de 40 horas semanales: el valor hora se calcula dividiendo el salario entre 40 horas por semana, lo que da una hora más alta que en la jornada diurna de 48 horas.';
    if(totH>P.maxMes)warn='Las horas extra registradas ('+totH+') superan el máximo mensual aproximado. '+P.maxRef;
    summary=`Nómina ${C.name}: salario ${fmt(sal)}, ${totH} horas especiales, neto ${fmt(neto)}, costo empleador ${fmt(costo)}.`;
  }
  if(warn)out=`<div class="alert" role="status">${esc(warn)}</div><div style="height:16px"></div>`+out;
  out+=`<a class="cta" href="${wa('Hola SFFContables, usé su calculadora. '+summary+' Quisiera validar mi caso.')}" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path></svg>Validar mi caso por WhatsApp</a>`;
  $('#card').innerHTML=out;
}

function renderNote(){
  $('#note').innerHTML=`<strong>Resultados referenciales</strong><span>Estas calculadoras usan las tasas y tramos vigentes en Panamá para 2026 (Código Fiscal, Código de Trabajo y Ley 462 de la CSS). No sustituyen una asesoría: deducciones, créditos y regímenes especiales pueden cambiar el resultado. Valide su caso antes de declarar o pagar.</span>`;
}

function renderAll(){renderChrome();renderForm();calc();renderNote();save();}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c){state.c=c.dataset.c;renderAll();return;}
  const t=e.target.closest('[data-t]');if(t){state.t=t.dataset.t;try{history.replaceState(null,'','#'+state.t);}catch(_){}renderAll();}
});
$('#tabs').addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const i=TABS.findIndex(x=>x[0]===state.t);const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;state.t=TABS[j][0];renderAll();document.getElementById('tab-'+state.t).focus();});
$('#form').addEventListener('input',calc);
$('#form').addEventListener('change',calc);
$('#form').addEventListener('submit',e=>e.preventDefault());

renderAll();
})();
</script>
